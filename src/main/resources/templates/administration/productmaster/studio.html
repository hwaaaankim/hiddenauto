<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  lang="ko"
  data-layout="twocolumn"
  data-sidebar="light"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head th:replace="~{fragments/administration/common :: autoAdminHead}"></head>
  <body class="twocolumn-panel">
    <div id="layout-wrapper">
      <header
        th:replace="~{fragments/administration/common :: autoAdminHeader}"
      ></header>
      <div
        th:replace="~{fragments/administration/common :: autoAdminModal}"
      ></div>
      <div
        th:replace="~{fragments/administration/common :: autoAdminSideMenu}"
      ></div>
      <div class="vertical-overlay"></div>
      <div class="main-content">
        <div class="page-content">
          <main
            id="pm-studio"
            th:attr="data-mode=${studioMode},data-product-id=${productId}"
            class="pms"
          >
            <header class="pms-heading">
              <div class="pms-heading-copy">
                <span class="pms-eyebrow"
                  ><span data-icon="layers"></span> PRODUCT CONFIGURATION</span
                >
                <h1 id="pms-title">제품관리</h1>
                <p id="pms-description" class="pms-description"></p>
              </div>
              <div class="pms-actions">
                <button id="pms-guide" type="button">
                  <span data-icon="help"></span> 화면안내</button
                ><a href="/front/productmaster" target="_blank" rel="noopener"
                  ><span data-icon="chat"></span> 고객 챗봇</a
                >
              </div>
            </header>
            <div
              id="pms-overview"
              class="pms-overview"
              aria-label="제품관리 현황"
            ></div>
            <nav class="pms-nav" aria-label="제품관리">
              <a data-tab="groups" href="/admin/product-master/groups"
                ><span data-icon="layers"></span
                ><span>그룹·옵션<small>기본 구조와 입력 방식</small></span></a
              >
              <a data-tab="builder" href="/admin/product-master/products/new"
                ><span data-icon="combine"></span
                ><span
                  >제품 조합 생성<small>구성 · 제품명 · 중복 검사</small></span
                ></a
              >
              <a data-tab="standard" href="/admin/product-master/products"
                ><span data-icon="box"></span
                ><span
                  >규격 제품 관리<small>사양 검색과 재고 관리</small></span
                ></a
              >
              <a data-tab="custom" href="/admin/product-master/non-standard"
                ><span data-icon="flow"></span
                ><span
                  >비규격 제품 관리<small
                    >질문 프로세스와 조건 연결</small
                  ></span
                ></a
              >
            </nav>
            <div id="pms-notice" role="status" aria-live="polite"></div>
            <div id="pms-workspace" class="pms-workspace">
              <div class="pms-empty">제품관리 정보를 불러오고 있습니다.</div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <link
      rel="stylesheet"
      href="/administration/assets/css/page/productMaster/productStudio.css?v=20260915-3"
    />
    <th:block
      th:replace="~{fragments/administration/common :: autoAdminSetting}"
    ></th:block>
    <th:block
      th:replace="~{fragments/administration/common :: authAdminScript}"
    ></th:block>
    <script src="/administration/assets/libs/sortablejs/Sortable.min.js"></script>
    <script src="/administration/assets/js/page/productMaster/studio/common.js?v=20260915-3"></script>
    <script src="/administration/assets/js/page/productMaster/studio/groups.js?v=20260915-3"></script>
    <script src="/administration/assets/js/page/productMaster/studio/products.js?v=20260915-3"></script>
    <script src="/administration/assets/js/page/productMaster/studio/process.js?v=20260915-3"></script>
    <script src="/administration/assets/js/page/productMaster/studio/tour.js?v=20260915-3"></script>
    <script src="/administration/assets/js/page/productMaster/studio/main.js?v=20260915-3"></script>
  </body>
</html>
