<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" data-layout="twocolumn" data-sidebar="light" data-sidebar-size="lg"
	data-sidebar-image="none" data-preloader="disable">

<head th:replace="~{fragments/administration/common :: autoAdminHead}">
</head>

<body class="twocolumn-panel member-management-page member-employee-insert-page">

	<!-- Begin page -->
	<div id="layout-wrapper">

		<header th:replace="~{fragments/administration/common :: autoAdminHeader}"></header>

		<div th:replace="~{fragments/administration/common :: autoAdminModal}"></div>
		<div th:replace="~{fragments/administration/common :: autoAdminSideMenu}"></div>
		<div class="vertical-overlay"></div>
		<div class="main-content">

			<div class="page-content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-12">
							<div class="page-title-box d-sm-flex align-items-center justify-content-between">
								<div>
									<span class="member-page-kicker">Employee Management</span>
									<h4 class="mb-sm-0">직원 등록</h4>
									<p class="member-page-description">계정 정보와 소속을 입력하면 팀 정책에 맞는 추가 항목이 자동으로 표시됩니다.</p>
								</div>

								<div class="page-title-right">
									<ol class="breadcrumb m-0">
										<li class="breadcrumb-item"><a href="javascript: void(0);">직원관리</a></li>
										<li class="breadcrumb-item active">직원등록</li>
									</ol>
								</div>

							</div>
						</div>
					</div>

					<form action="/management/employeeInsert" method="POST" id="employee-insert-form">
						<div class="row">
							<div class="col-lg-6">
								<div class="card member-form-card">
									<div class="card-header">
										<div class="member-section-heading">
											<span class="member-section-icon"><i class="ri-user-add-line"></i></span>
											<div>
												<h5 class="card-title mb-0">기본 계정 정보</h5>
												<span class="member-section-description">로그인과 직원 연락에 필요한 정보를 입력해 주세요.</span>
											</div>
										</div>
									</div>
									<div class="card-body">
										<div class="mb-3">
											<label class="form-label">아이디</label>
											<input type="text" class="form-control" name="username" autocomplete="username"
												placeholder="로그인 아이디" required>
											<input type="hidden" name="regionJson" id="regionJsonInput">
										</div>

										<div class="mb-3">
											<label class="form-label">비밀번호</label>
											<input type="password" class="form-control" name="password"
												autocomplete="new-password" placeholder="초기 비밀번호" required>
										</div>

										<div class="mb-3">
											<label class="form-label">이름</label>
											<input type="text" class="form-control" name="name" autocomplete="name"
												placeholder="직원 이름" required>
										</div>

										<div class="mb-3">
											<label class="form-label">연락처</label>
											<input type="text" class="form-control" name="phone" autocomplete="tel"
												placeholder="휴대전화 또는 연락처" required>
										</div>

										<div class="mb-3">
											<label class="form-label">이메일</label>
											<input type="email" class="form-control" name="email" autocomplete="email"
												placeholder="name@example.com">
										</div>

										<div class="mb-3">
											<label class="form-label">권한</label>
											<select class="form-select" name="role" required>
												<option value="">권한선택</option>
												<option value="MANAGEMENT">관리직</option>
												<option value="INTERNAL_EMPLOYEE">현장직</option>
											</select>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-6">
								<div class="card member-form-card">
									<div class="card-header">
										<div class="member-section-heading">
											<span class="member-section-icon"><i class="ri-team-line"></i></span>
											<div>
												<h5 class="card-title mb-0">소속 및 업무 범위</h5>
												<span class="member-section-description">팀에 따라 카테고리 또는 담당 지역을 추가로 지정합니다.</span>
											</div>
										</div>
									</div>
									<div class="card-body">
										<div class="mb-3">
											<label class="form-label">팀</label>
											<select class="form-select" id="teamSelect" name="teamId" required>
												<option value="">팀 선택</option>
												<option th:each="team : ${teams}" th:value="${team.id}"
													th:text="${team.name}"></option>
											</select>
										</div>
										<div class="member-dynamic-guide" id="employee-insert-dynamic-guide" aria-live="polite">
											<div class="member-dynamic-guide-title" id="employee-insert-dynamic-guide-title">
												<i class="ri-layout-grid-line me-1"></i>팀별 추가 설정
											</div>
											<div id="employee-insert-dynamic-guide-text">
												팀을 선택하면 필요한 카테고리 또는 담당 지역 입력란이 이 영역에 표시됩니다.
											</div>
										</div>

										<div class="member-dynamic-fields">
										<!-- 생산팀/출고팀 카테고리 (JS로 동적 표시) -->
										<div class="mb-3" id="teamCategoryWrapper" style="display:none">
											<label class="form-label">카테고리</label>
											<select class="form-select" id="teamCategorySelect" name="teamCategoryId">
												<option value="">카테고리 선택</option>
												<option th:each="category : ${teamCategories}"
													th:data-team-id="${category.team.id}" th:value="${category.id}"
													th:text="${category.name}"></option>
											</select>
										</div>

										<!-- 주소 선택 Province-City-District (JS로 동적 연결) -->
										<div class="mb-3" id="provinceWrapper" style="display:none">
											<label class="form-label">도 선택</label>
											<select id="provinceSelect" class="form-select">
												<option value="">도 선택</option>
												<option th:each="province : ${provinces}" th:value="${province.id}"
													th:text="${province.name}"></option>
											</select>
										</div>

										<div class="mb-3" id="cityWrapper" style="display:none">
											<label class="form-label">시 선택</label>
											<select id="citySelect" class="form-select"></select>
										</div>

										<div class="mb-3" id="districtWrapper" style="display:none">
											<label class="form-label">구 선택</label>
											<select id="districtSelect" class="form-select"></select>
										</div>
										</div>
									</div>
								</div>
							</div>
						<div class="d-flex justify-content-end gap-2 mb-4">
							<a href="/management/employeeList" class="btn btn-light">목록으로</a>
							<button class="btn btn-success px-4" type="submit"><i class="ri-save-line me-1"></i>직원 등록</button>
							</div>
						</div>
					</form>
				</div>
			</div>
			<footer th:replace="~{fragments/administration/common :: autoAdminFooter}"></footer>
		</div>
	</div>
	<th:block th:replace="~{fragments/administration/common :: autoAdminSetting}"></th:block>
	<th:block th:replace="~{fragments/administration/common :: authAdminScript}"></th:block>
	<script src="/administration/assets/js/pages/employeeInsertForm.js?v=20260908-1"></script>
</body>

</html>
