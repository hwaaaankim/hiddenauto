<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 발주관리 바로출력</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 8mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #111827;
            background: #fff;
            font-family: "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
            font-size: 9pt;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 10px;
        }

        .toolbar button {
            border: 1px solid #94a3b8;
            border-radius: 5px;
            padding: 7px 12px;
            background: #fff;
            cursor: pointer;
        }

        .print-header {
            margin-bottom: 10px;
        }

        .print-header h1 {
            margin: 0 0 6px;
            font-size: 17pt;
            text-align: center;
        }

        .print-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 7px;
            font-size: 8.5pt;
        }

        .filter-box {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 10px;
            padding: 7px 9px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
        }

        .filter-item strong {
            margin-right: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid #64748b;
            padding: 4px 5px;
            vertical-align: middle;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        th {
            background: #e2e8f0;
            text-align: center;
            font-weight: 700;
        }

        .center {
            text-align: center;
        }

        .product-highlight {
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1.5px;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #64748b;
        }

        @media print {
            .toolbar {
                display: none;
            }

            thead {
                display: table-header-group;
            }

            tr {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body th:attr="data-product-name-keyword=${productNameKeyword}">
<div class="toolbar">
    <button type="button" onclick="window.print()">인쇄</button>
    <button type="button" onclick="window.close()">닫기</button>
</div>

<section class="print-header">
    <h1>관리자 발주관리</h1>
    <div class="print-meta">
        <span th:text="|조회 결과 ${#lists.size(rows)}건|">조회 결과 0건</span>
        <span th:text="${generatedAt != null ? '출력시각 ' + #temporals.format(generatedAt, 'yyyy-MM-dd HH:mm:ss') : ''}">출력시각</span>
    </div>
    <div class="filter-box">
        <span class="filter-item" th:each="filter : ${filters}">
            <strong th:text="|${filter.label}:|">조건:</strong>
            <span th:text="${filter.value}">값</span>
        </span>
    </div>
</section>

<table th:if="${rows != null and !#lists.isEmpty(rows)}">
    <colgroup>
        <col style="width:6%">
        <col style="width:11%">
        <col style="width:8%">
        <col style="width:22%">
        <col style="width:6%">
        <col style="width:25%">
        <col style="width:7%">
        <col style="width:7%">
        <col style="width:8%">
    </colgroup>
    <thead>
    <tr>
        <th>오더 ID</th>
        <th>대리점명</th>
        <th>제품분류</th>
        <th>제품정보</th>
        <th>규격</th>
        <th>비고</th>
        <th>발주일</th>
        <th>배송희망일</th>
        <th>상태</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td class="center" th:text="${row.orderId}">1</td>
        <td th:text="${row.companyName}">대리점명</td>
        <td class="center" th:text="${row.productCategoryName != null and row.productCategoryName != '' ? row.productCategoryName : '미지정'}">제품분류</td>
        <td class="product-highlight-target" th:text="${row.productSummary}">제품정보</td>
        <td class="center" th:text="${row.standard ? '규격' : '비규격'}">규격</td>
        <td th:text="${row.noteSummary}">비고</td>
        <td class="center" th:text="${row.createdAt != null ? #temporals.format(row.createdAt, 'yy/MM/dd') : '-'}">-</td>
        <td class="center" th:text="${row.preferredDeliveryDate != null ? #temporals.format(row.preferredDeliveryDate, 'yy/MM/dd') : '-'}">-</td>
        <td class="center" th:text="${row.statusLabel}">상태</td>
    </tr>
    </tbody>
</table>

<div class="empty" th:if="${rows == null or #lists.isEmpty(rows)}">
    현재 검색조건에 해당하는 발주가 없습니다.
</div>

<script>
    (function () {
        "use strict";

        const keyword = String(document.body.dataset.productNameKeyword || "").trim();
        if (keyword) {
            const normalizedKeyword = keyword.toLocaleLowerCase();
            document.querySelectorAll(".product-highlight-target").forEach(function (target) {
                const originalText = String(target.textContent || "");
                const normalizedText = originalText.toLocaleLowerCase();
                let searchIndex = 0;
                let matchIndex = normalizedText.indexOf(normalizedKeyword, searchIndex);

                if (matchIndex < 0) {
                    return;
                }

                const fragment = document.createDocumentFragment();
                while (matchIndex >= 0) {
                    if (matchIndex > searchIndex) {
                        fragment.appendChild(document.createTextNode(originalText.slice(searchIndex, matchIndex)));
                    }

                    const mark = document.createElement("span");
                    mark.className = "product-highlight";
                    mark.textContent = originalText.slice(matchIndex, matchIndex + keyword.length);
                    fragment.appendChild(mark);

                    searchIndex = matchIndex + keyword.length;
                    matchIndex = normalizedText.indexOf(normalizedKeyword, searchIndex);
                }

                if (searchIndex < originalText.length) {
                    fragment.appendChild(document.createTextNode(originalText.slice(searchIndex)));
                }
                target.replaceChildren(fragment);
            });
        }

        window.addEventListener("load", function () {
            window.setTimeout(function () {
                window.print();
            }, 150);
        });
    })();
</script>
</body>
</html>
