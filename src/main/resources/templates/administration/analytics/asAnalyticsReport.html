<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>AS 분석 보고서</title>
<style>body{font:13px/1.7 "Malgun Gothic",sans-serif;color:#1e293b;margin:25px}h1{font-size:24px}h2{font-size:17px;margin-top:24px}p{margin:6px 0}table{width:100%;border-collapse:collapse;margin:12px 0;table-layout:auto}th,td{padding:7px;border:1px solid #cbd5e1;overflow-wrap:anywhere}th{background:#f1f5f9}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}thead{display:table-header-group}tr{break-inside:avoid}.chart{break-inside:avoid;max-width:1100px}.note{color:#475569}.warning{color:#9a3412}button{padding:10px;border-radius:5px;cursor:pointer}@page{size:A4 landscape;margin:12mm}@media print{.no-print{display:none}body{margin:0;font-size:10px}.chart{max-height:160mm}h2{break-after:avoid}.group{break-before:page}table{font-size:10px}}</style></head>
<body><button class="no-print" onclick="window.print()">인쇄 · PDF로 저장</button><h1>AS 분석 보고서</h1>
<p th:text="${bundle.meta.periodText}"></p><p th:text="${bundle.meta.yAxisText}"></p><p th:text="${bundle.meta.filterText}"></p><p th:text="${bundle.meta.viewText}"></p><p th:text="${bundle.meta.generatedAtText}"></p><p class="note" th:text="${bundle.meta.basisText}"></p>
<h2>분석 요약</h2><p th:each="line:${analysis.insights}" th:text="${line}"></p><p class="warning" th:each="line:${bundle.warnings}" th:text="${line}"></p>
<h2>전체 합계</h2><p th:text="${'신청 '+#numbers.formatInteger(bundle.totals.metrics['asCount'],1,'COMMA')+'건 · 완료 '+#numbers.formatInteger(bundle.totals.metrics['completedCount'],1,'COMMA')+'건 · 미완료 '+#numbers.formatInteger(bundle.totals.metrics['pendingCount'],1,'COMMA')+'건 · AS 비용 '+#numbers.formatInteger(bundle.totals.metrics['cost'],1,'COMMA')+'원'}"></p>
<section th:if="${bundle.chart!=null}"><h2>선택 그래프</h2><p class="note" th:text="${bundle.meta.chartBasisText}"></p><div class="chart" th:each="svg:${bundle.chart.svgPages}" th:utext="${svg}"></div>
<table><thead><tr><th>항목·기간</th><th class="num" th:each="series:${bundle.chart.series}" th:text="${series.label+' ('+series.unit+')'}"></th></tr></thead><tbody><tr th:each="label,stat:${bundle.chart.labels}"><td th:text="${label}"></td><td class="num" th:each="series:${bundle.chart.series}" th:text="${#numbers.formatInteger(series.values[stat.index],1,'COMMA')}"></td></tr></tbody></table></section>
<section class="group" th:each="columns,stat:${bundle.reportColumnGroups}"><h2 th:text="${'조회 결과 · '+stat.count+'/'+stat.size}"></h2><p class="note" th:text="${bundle.meta.sortText}"></p><table><thead><tr><th th:each="col:${columns}" th:class="${col.unit!=null?'num':''}" th:text="${col.label+(col.unit!=null?' ('+col.unit+')':'')}"></th></tr></thead><tbody><tr th:each="row:${bundle.rows}"><td th:each="col:${columns}" th:class="${col.unit!=null?'num':''}" th:text="${row[col.key] instanceof T(java.lang.Number)?#numbers.formatInteger(row[col.key],1,'COMMA'):row[col.key]}"></td></tr></tbody><tfoot><tr><th th:each="col,cs:${columns}" th:class="${col.unit!=null?'num':''}" th:text="${col.unit!=null?#numbers.formatInteger(bundle.totals.metrics[col.key],1,'COMMA'):(cs.first?'전체 합계':'')}"></th></tr></tfoot></table></section>
<h2>지표 기준</h2><p th:each="col:${bundle.columns}" th:if="${col.help!=null}" th:text="${col.label+': '+col.help}"></p>
</body></html>
