<!-- productionStickerPrint.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생산 스티커 출력</title>

    <style>
        :root {
            /*
             * A4 세로 210mm × 297mm에서 상하좌우 5mm를 제외한 고정 출력 영역입니다.
             * 아래 규격은 데이터 길이와 무관하게 절대 변경되지 않습니다.
             */
            --page-margin: 5mm;
            --sheet-width: 200mm;
            --sheet-height: 287mm;

            /* 2열 × 2행: 스티커 한 장의 물리 규격 */
            --label-width: 100mm;
            --label-height: 143.5mm;
            --label-padding: 3.5mm;

            /* 스티커 내부 고정 규격 */
            --label-header-height: 7mm;
            --label-header-gap: 1.5mm;
            --report-height: 128mm;

            /* 보고서 각 행의 고정 높이: 합계 128mm */
            --row-company-height: 11mm;
            --row-category-color-height: 11mm;
            --row-product-height: 17mm;
            --row-size-height: 11mm;
            --row-memo-height: 33mm;
            --row-drawing-height: 45mm;

            --line-color: #9a9a9a;
            --line-width: 0.22mm;
            --cut-line-color: #b8b8b8;

            --font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", Arial, sans-serif;
            --font-base: 8.2pt;
            --font-label: 7.8pt;
        }

        @page {
            size: A4 portrait;
            margin: var(--page-margin);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            color: #222;
            background: #fff;
            font-family: var(--font-family);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            font-size: var(--font-base);
        }

        .no-print-items {
            padding: 20px;
            font-size: 12pt;
        }

        /*
         * 페이지 크기와 2×2 트랙을 mm 단위로 고정합니다.
         * 콘텐츠가 길어져도 grid track과 label의 크기는 늘어나지 않습니다.
         */
        .sheet {
            position: relative;
            width: var(--sheet-width);
            height: var(--sheet-height);
            min-width: var(--sheet-width);
            min-height: var(--sheet-height);
            max-width: var(--sheet-width);
            max-height: var(--sheet-height);
            margin: 0;
            display: grid;
            grid-template-columns: var(--label-width) var(--label-width);
            grid-template-rows: var(--label-height) var(--label-height);
            overflow: hidden;
            break-after: page;
            page-break-after: always;
        }

        .sheet:last-of-type {
            break-after: auto;
            page-break-after: auto;
        }

        /* 출력 후 수직·수평으로 절단하기 위한 중앙 가이드 */
        .sheet::before,
        .sheet::after {
            content: "";
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        .sheet::before {
            top: 0;
            bottom: 0;
            left: var(--label-width);
            border-left: 0.2mm dashed var(--cut-line-color);
            transform: translateX(-0.1mm);
        }

        .sheet::after {
            left: 0;
            right: 0;
            top: var(--label-height);
            border-top: 0.2mm dashed var(--cut-line-color);
            transform: translateY(-0.1mm);
        }

        .label {
            position: relative;
            width: var(--label-width);
            height: var(--label-height);
            min-width: var(--label-width);
            min-height: var(--label-height);
            max-width: var(--label-width);
            max-height: var(--label-height);
            padding: var(--label-padding);
            overflow: hidden;
            background: #fff;
        }

        /* 빈 칸도 grid 자리는 유지하므로 마지막 페이지 규격이 흐트러지지 않습니다. */
        .label.empty {
            visibility: hidden;
        }

        .label-header {
            width: 100%;
            height: var(--label-header-height);
            min-height: var(--label-header-height);
            max-height: var(--label-header-height);
            margin: 0 0 var(--label-header-gap);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3mm;
            overflow: hidden;
        }

        .label-header-left {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 1.7mm;
            font-size: 7.4pt;
            line-height: 1;
            white-space: nowrap;
        }

        .label-header-divider {
            color: #777;
        }

        .brand-name {
            flex: 0 0 auto;
            font-size: 9pt;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.55mm;
            white-space: nowrap;
        }

        /*
         * HTML table은 긴 내용에 따라 행 높이를 강제로 늘릴 수 있습니다.
         * 이를 막기 위해 보고서 영역을 고정 grid로 구성합니다.
         */
        .report-grid {
            width: 100%;
            height: var(--report-height);
            min-height: var(--report-height);
            max-height: var(--report-height);
            display: grid;
            grid-template-rows:
                var(--row-company-height)
                var(--row-category-color-height)
                var(--row-product-height)
                var(--row-size-height)
                var(--row-memo-height)
                minmax(0, 1fr);

            /*
             * 외곽선은 마지막 셀의 border-bottom에 맡기지 않습니다.
             * 고정 트랙 합계와 컨테이너 border가 겹치면서 하단 선이 overflow로
             * 잘리는 브라우저 인쇄 오차를 막기 위해 report-grid 자체가 네 면의
             * 외곽선을 담당합니다.
             */
            border: var(--line-width) solid var(--line-color);
            overflow: hidden;
            font-size: var(--font-base);
            line-height: 1.3;
        }

        .report-row {
            width: 100%;
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-columns: 16% 42% 16% 26%;
            overflow: hidden;
        }

        .report-cell {
            min-width: 0;
            min-height: 0;
            padding: 1.4mm 1.8mm;
            border-right: var(--line-width) solid var(--line-color);
            border-bottom: var(--line-width) solid var(--line-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* 바깥쪽 선은 report-grid가 담당하므로 내부 중복선을 제거합니다. */
        .report-row > .report-cell:last-child {
            border-right: 0;
        }

        .report-row:last-child > .report-cell {
            border-bottom: 0;
        }

        .report-label {
            padding-left: 1mm;
            padding-right: 1mm;
            justify-content: center;
            text-align: center;
            font-size: var(--font-label);
            font-weight: 700;
            line-height: 1.15;
            white-space: nowrap;
            background: #fff;
        }

        .report-value {
            font-weight: 400;
        }

        .span-3 {
            grid-column: span 3;
        }

        .align-top {
            align-items: flex-start;
        }

        /* 텍스트는 셀 영역 안에서만 측정·축소되며 행 크기에 영향을 주지 않습니다. */
        .fit-cell {
            position: relative;
        }

        .fit-text {
            display: block;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow: visible;
            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: anywhere;
            line-height: 1.28;
        }

        .company-value .fit-text,
        .product-value .fit-text {
            font-weight: 500;
        }

        .drawing-cell {
            padding: 1mm 1.4mm;
            align-items: center;
            justify-content: center;
        }

        .drawing-frame {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .drawing-image {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
        }

        @media screen {
            body {
                padding: 12px;
                background: #eceff3;
            }

            .sheet {
                margin: 0 auto 16px;
                background: #fff;
                box-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
            }
        }

        @media print {
            html,
            body {
                width: auto;
                height: auto;
                background: #fff;
            }

            body {
                padding: 0;
            }

            .sheet {
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <div th:if="${totalCount == 0}" class="no-print-items">
        출력할 항목이 없습니다.
    </div>

    <div th:each="pageItems : ${pages}" class="sheet">

        <article th:each="item : ${pageItems}" class="label">
            <header class="label-header">
                <div class="label-header-left">
                    <span th:text="${item.deliveryDateText != null and item.deliveryDateText != '' ? item.deliveryDateText : '-'}">
                        2026-02-11
                    </span>
                    <span class="label-header-divider">|</span>
                    <span th:text="${item.standard ? '규격' : '비규격'}">비규격</span>
                </div>

                <div class="brand-name">HIDDEN BATH</div>
            </header>

            <div class="report-grid" role="table" aria-label="생산 스티커 정보">
                <div class="report-row" role="row">
                    <div class="report-cell report-label" role="rowheader">업체명</div>
                    <div class="report-cell report-value span-3 fit-cell company-value"
                        role="cell" data-max-font="8.2" data-min-font="4.0">
                        <span class="fit-text"
                            th:text="${item.companyName != null and item.companyName != '' ? item.companyName : '-'}">
                            주식회사 더이케이파트너스
                        </span>
                    </div>
                </div>

                <div class="report-row" role="row">
                    <div class="report-cell report-label" role="rowheader">품목</div>
                    <div class="report-cell report-value fit-cell"
                        role="cell" data-max-font="8.2" data-min-font="4.0">
                        <span class="fit-text"
                            th:text="${item.category != null and item.category != '' ? item.category : '-'}">
                            욕실용품
                        </span>
                    </div>
                    <div class="report-cell report-label" role="rowheader">색상</div>
                    <div class="report-cell report-value fit-cell"
                        role="cell" data-max-font="8.2" data-min-font="3.8">
                        <span class="fit-text"
                            th:text="${item.color != null and item.color != '' ? item.color : '-'}">
                            페블 프러스트
                        </span>
                    </div>
                </div>

                <div class="report-row" role="row">
                    <div class="report-cell report-label" role="rowheader">제품명</div>
                    <div class="report-cell report-value span-3 fit-cell product-value"
                        role="cell" data-max-font="8.2" data-min-font="3.6">
                        <span class="fit-text"
                            th:text="${item.productName != null and item.productName != '' ? item.productName : '-'}">
                            대리석 일자 선반 W (페블프러스트)
                        </span>
                    </div>
                </div>

                <div class="report-row" role="row">
                    <div class="report-cell report-label" role="rowheader">사이즈</div>
                    <div class="report-cell report-value span-3 fit-cell"
                        role="cell" data-max-font="8.2" data-min-font="4.0">
                        <span class="fit-text"
                            th:text="${item.size != null and item.size != '' ? item.size : '-'}">
                            700*100
                        </span>
                    </div>
                </div>

                <div class="report-row" role="row">
                    <div class="report-cell report-label" role="rowheader">비고</div>
                    <div class="report-cell report-value span-3 fit-cell align-top"
                        role="cell" data-max-font="7.8" data-min-font="3.0">
                        <span class="fit-text"
                            th:text="${item.adminMemo != null ? item.adminMemo : ''}">
                            관리자 메모
                        </span>
                    </div>
                </div>

                <div class="report-row" role="row">
                    <div class="report-cell report-label" role="rowheader">도면</div>
                    <div class="report-cell report-value span-3 drawing-cell" role="cell">
                        <div class="drawing-frame">
                            <img th:if="${item.adminImageUrl != null and item.adminImageUrl != ''}"
                                class="drawing-image"
                                th:src="${item.adminImageUrl}"
                                alt="관리자 도면 이미지">
                        </div>
                    </div>
                </div>
            </div>
        </article>

        <!-- 마지막 페이지가 4건 미만이어도 빈 칸이 같은 규격을 점유합니다. -->
        <article th:if="${pageItems.size() < 4}"
            th:each="x : ${#numbers.sequence(1, 4 - pageItems.size())}"
            class="label empty"
            aria-hidden="true">
            <span>.</span>
        </article>
    </div>

    <script>
        (function () {
            'use strict';

            var ABSOLUTE_MIN_FONT_PT = 2.4;
            var FONT_PRECISION_PT = 0.05;

            function numberOrDefault(value, fallback) {
                var parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : fallback;
            }

            function availableContentSize(cell) {
                var style = window.getComputedStyle(cell);
                var width = cell.clientWidth
                    - numberOrDefault(parseFloat(style.paddingLeft), 0)
                    - numberOrDefault(parseFloat(style.paddingRight), 0);
                var height = cell.clientHeight
                    - numberOrDefault(parseFloat(style.paddingTop), 0)
                    - numberOrDefault(parseFloat(style.paddingBottom), 0);

                return {
                    width: Math.max(0, width),
                    height: Math.max(0, height)
                };
            }

            function setFontSize(content, fontSize) {
                content.style.fontSize = fontSize.toFixed(2) + 'pt';
            }

            function isContentFitted(content, size) {
                return content.scrollWidth <= size.width + 0.75
                    && content.scrollHeight <= size.height + 0.75;
            }

            /*
             * 셀의 높이·너비는 절대로 변경하지 않고 텍스트만 축소합니다.
             * 먼저 지정된 최소 글꼴까지 이진 탐색하고, 그래도 길면 안전 하한까지 추가 축소합니다.
             */
            function fitTextCell(cell) {
                var content = cell.querySelector('.fit-text');

                if (!content) {
                    return;
                }

                var maxFont = numberOrDefault(cell.getAttribute('data-max-font'), 8.2);
                var preferredMinFont = numberOrDefault(cell.getAttribute('data-min-font'), 4.0);
                var size = availableContentSize(cell);

                if (size.width <= 0 || size.height <= 0) {
                    return;
                }

                content.style.width = '100%';
                content.style.maxWidth = '100%';
                setFontSize(content, maxFont);

                if (isContentFitted(content, size)) {
                    return;
                }

                var low = Math.max(preferredMinFont, ABSOLUTE_MIN_FONT_PT);
                var high = maxFont;
                var best = low;
                var i;

                for (i = 0; i < 16; i += 1) {
                    var mid = (low + high) / 2;
                    setFontSize(content, mid);

                    if (isContentFitted(content, size)) {
                        best = mid;
                        low = mid;
                    } else {
                        high = mid;
                    }
                }

                setFontSize(content, best);

                if (isContentFitted(content, size)) {
                    return;
                }

                var safetyFont = best;

                while (safetyFont > ABSOLUTE_MIN_FONT_PT) {
                    safetyFont = Math.max(
                        ABSOLUTE_MIN_FONT_PT,
                        safetyFont - FONT_PRECISION_PT
                    );
                    setFontSize(content, safetyFont);

                    if (isContentFitted(content, size)) {
                        return;
                    }
                }

                /* 비정상적으로 긴 값도 고정 양식을 밀어내지 않도록 마지막으로 셀 안에서만 숨깁니다. */
                cell.style.overflow = 'hidden';
            }

            function fitAllText() {
                document.querySelectorAll('.fit-cell').forEach(fitTextCell);
            }

            function waitForImages() {
                var images = Array.prototype.slice.call(document.images || []);

                return Promise.all(images.map(function (image) {
                    if (image.complete) {
                        return Promise.resolve();
                    }

                    return new Promise(function (resolve) {
                        image.addEventListener('load', resolve, { once: true });
                        image.addEventListener('error', resolve, { once: true });
                    });
                }));
            }

            function waitForFonts() {
                if (document.fonts && document.fonts.ready) {
                    return document.fonts.ready.catch(function () {
                        return undefined;
                    });
                }

                return Promise.resolve();
            }

            window.addEventListener('beforeprint', fitAllText);

            window.addEventListener('load', function () {
                Promise.all([waitForFonts(), waitForImages()]).then(function () {
                    fitAllText();

                    window.requestAnimationFrame(function () {
                        window.setTimeout(function () {
                            fitAllText();
                            window.print();
                        }, 120);
                    });
                });
            });
        })();
    </script>

</body>

</html>
