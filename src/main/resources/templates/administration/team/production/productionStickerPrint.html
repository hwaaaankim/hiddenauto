<!-- productionStickerPrint.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생산 스티커 출력</title>
    <style>
        :root {
            --sheet-width: 210mm;
            --sheet-height: 297mm;
            --sheet-padding-top: 7mm;
            --sheet-padding-right: 4.9mm;
            --sheet-padding-bottom: 8.3mm;
            --sheet-padding-left: 4.9mm;

            --label-width: 99.1mm;
            --label-height: 140mm;
            --label-column-gap: 2mm;
            --label-row-gap: 1.7mm;
            --label-padding: 3mm;

            /*
             * 확대된 글씨가 table의 최소 높이를 밀어 올려 아래쪽 라벨이 잘리지 않도록
             * 표 자체를 라벨 내부 높이보다 여유 있게 구성합니다.
             */
            --label-header-height: 9mm;
            --label-header-gap: 2mm;
            --report-table-height: 116mm;

            /* 업체명/품목·색상/제품명/사이즈 행은 모두 동일한 높이입니다. */
            --row-main-height: 22mm;
            --row-memo-height: 28mm;

            --line-color: #7f7f7f;
            --line-width: 0.75pt;
            --label-background: #f4f4f4;

            --font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", Arial, sans-serif;
            --font-base: 14.7pt;
            --font-label: 14.3pt;
            --font-header: 13.9pt;
            --font-brand: 15.5pt;
        }

        @page {
            size: 210mm 297mm;
            margin: 0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: var(--sheet-width);
            margin: 0;
            padding: 0;
            color: #222;
            background: #fff;
            font-family: var(--font-family);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            font-size: var(--font-base);
        }

        .no-print-items {
            width: var(--sheet-width);
            padding: 20px;
            font-size: 14pt;
        }

        .sheet {
            width: var(--sheet-width);
            height: var(--sheet-height);
            margin: 0;
            padding: var(--sheet-padding-top) var(--sheet-padding-right) var(--sheet-padding-bottom) var(--sheet-padding-left);
            display: grid;
            grid-template-columns: var(--label-width) var(--label-width);
            grid-template-rows: var(--label-height) var(--label-height);
            column-gap: var(--label-column-gap);
            row-gap: var(--label-row-gap);
            align-content: start;
            justify-content: start;
            overflow: hidden;
            break-after: page;
            page-break-after: always;
        }

        .sheet:last-of-type {
            break-after: auto;
            page-break-after: auto;
        }

        .label {
            width: var(--label-width);
            height: var(--label-height);
            padding: var(--label-padding);
            display: grid;
            grid-template-rows:
                var(--label-header-height)
                var(--label-header-gap)
                var(--report-table-height);
            border: 0;
            border-radius: 0;
            outline: 0;
            overflow: hidden;
            background: #fff;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .label.empty {
            visibility: hidden;
        }

        .label-header {
            grid-row: 1;
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3mm;
            overflow: hidden;
        }

        .label-header-left {
            min-width: 0;
            display: flex;
            align-items: center;
            overflow: hidden;
            font-size: var(--font-header);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.12mm;
            white-space: nowrap;
        }

        .brand-name {
            flex: 0 0 auto;
            font-size: var(--font-brand);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.42mm;
            white-space: nowrap;
        }

        /*
         * 인쇄 렌더러가 table 셀 테두리를 합성할 때 생기는 모서리 돌출을 막기 위해
         * table은 내용 배치만 담당하고, 모든 선은 하나의 SVG 레이어에서 그립니다.
         */
        .report-table-frame {
            grid-row: 3;
            position: relative;
            width: 100%;
            height: var(--report-table-height);
            overflow: hidden;
            background: #fff;
        }

        .report-table {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border: 0;
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
            font-size: var(--font-base);
            line-height: 1.22;
        }

        .report-grid-lines {
            position: absolute;
            z-index: 3;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .report-grid-lines rect,
        .report-grid-lines line {
            fill: none;
            stroke: var(--line-color);
            stroke-width: var(--line-width);
            vector-effect: non-scaling-stroke;
            shape-rendering: geometricPrecision;
        }

        .report-grid-lines line {
            stroke-linecap: butt;
        }

        .report-grid-lines rect {
            stroke-linejoin: miter;
        }

        /* 글씨 확대 후에도 '업체명/제품명/사이즈'가 한 줄로 보이도록 라벨 열을 넓힙니다. */
        .report-table col.col-label {
            width: 20%;
        }

        .report-table col.col-value-main {
            width: 30%;
        }

        .report-table col.col-label-secondary {
            width: 20%;
        }

        .report-table col.col-value-secondary {
            width: 30%;
        }

        .report-table tr.row-company,
        .report-table tr.row-category-color,
        .report-table tr.row-product,
        .report-table tr.row-size {
            height: var(--row-main-height);
        }

        .report-table tr.row-memo {
            height: var(--row-memo-height);
        }

        /*
         * table의 height는 브라우저에서 최소 높이처럼 처리될 수 있습니다.
         * 따라서 각 셀과 내부 뷰포트의 실제 높이를 함께 고정하여
         * 비고 줄 수가 많아도 행 자체가 늘어나지 않도록 합니다.
         */
        .report-table tr.row-company > th,
        .report-table tr.row-company > td,
        .report-table tr.row-category-color > th,
        .report-table tr.row-category-color > td,
        .report-table tr.row-product > th,
        .report-table tr.row-product > td,
        .report-table tr.row-size > th,
        .report-table tr.row-size > td {
            height: var(--row-main-height);
        }

        .report-table tr.row-memo > th,
        .report-table tr.row-memo > td {
            height: var(--row-memo-height);
        }

        .report-table th,
        .report-table td {
            min-width: 0;
            padding: 1.8mm 2.2mm;
            overflow: hidden;
            border: 0;
            vertical-align: middle;
            text-align: left;
            font-weight: 700;
        }

        .report-table th.report-label {
            padding-right: 1mm;
            padding-left: 1mm;
            background: var(--label-background);
            font-size: var(--font-label);
            font-weight: 700;
            line-height: 1.08;
            text-align: center;
            white-space: nowrap;
        }

        .fit-cell {
            position: relative;
        }

        /*
         * 내용이 셀 높이를 밀어 올리지 못하도록 고정 크기 뷰포트 안에 넣습니다.
         * 주요 정보 행: 22mm - 패딩/테두리 여유
         * 비고 행: 28mm - 패딩/테두리 여유
         */
        .fit-viewport {
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .row-company .fit-viewport,
        .row-category-color .fit-viewport,
        .row-product .fit-viewport,
        .row-size .fit-viewport {
            height: 17.4mm;
            max-height: 17.4mm;
        }

        .row-memo .fit-viewport {
            height: 23.3mm;
            max-height: 23.3mm;
            align-items: flex-start;
        }

        .fit-text {
            display: block;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            flex: 0 0 100%;
            overflow: visible;
            line-height: 1.18;
            font-weight: 700;
            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: normal;
        }

        .align-top {
            padding-top: 2.2mm !important;
            vertical-align: top !important;
        }

        @media screen {
            html,
            body {
                width: auto;
                min-width: var(--sheet-width);
            }

            body {
                padding: 12px;
                background: #eceff3;
            }

            .sheet {
                margin: 0 auto 16px;
                background: #fff;
                box-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
            }
        }

        @media print {
            html,
            body {
                width: var(--sheet-width);
                background: #fff;
            }

            body {
                padding: 0;
            }

            .sheet {
                margin: 0;
                box-shadow: none;
            }

        }
    </style>
</head>
<body>
    <div th:if="${totalCount == 0}" class="no-print-items">출력할 항목이 없습니다.</div>

    <div th:each="pageItems : ${pages}" class="sheet">
        <article th:each="item : ${pageItems}" class="label">
            <header class="label-header">
                <div class="label-header-left">
                    <span th:text="${item.standard ? '규격' : '비규격'}">비규격</span>
                </div>
                <div class="brand-name">HIDDEN BATH</div>
            </header>

            <div class="report-table-frame">
                <table class="report-table" aria-label="생산 스티커 정보">
                <colgroup>
                    <col class="col-label">
                    <col class="col-value-main">
                    <col class="col-label-secondary">
                    <col class="col-value-secondary">
                </colgroup>
                <tbody>
                    <tr class="row-company">
                        <th scope="row" class="report-label">업체명</th>
                        <td colspan="3"
                            class="fit-cell company-value"
                            data-max-font="14.7"
                            data-min-font="9.0">
                            <div class="fit-viewport">
                                <span class="fit-text"
                                      th:text="${item.companyName != null and item.companyName != '' ? item.companyName : '-'}">
                                    주식회사 더이케이파트너스
                                </span>
                            </div>
                        </td>
                    </tr>

                    <tr class="row-category-color">
                        <th scope="row" class="report-label">품목</th>
                        <td class="fit-cell"
                            data-max-font="14.7"
                            data-min-font="8.0">
                            <div class="fit-viewport">
                                <span class="fit-text"
                                      th:text="${item.category != null and item.category != '' ? item.category : '-'}">
                                    욕실용품
                                </span>
                            </div>
                        </td>
                        <th scope="row" class="report-label">색상</th>
                        <td class="fit-cell"
                            data-max-font="14.7"
                            data-min-font="7.5">
                            <div class="fit-viewport">
                                <span class="fit-text"
                                      th:text="${item.color != null and item.color != '' ? item.color : '-'}">
                                    페블 프러스트
                                </span>
                            </div>
                        </td>
                    </tr>

                    <tr class="row-product">
                        <th scope="row" class="report-label">제품명</th>
                        <td colspan="3"
                            class="fit-cell product-value"
                            data-max-font="14.7"
                            data-min-font="7.5">
                            <div class="fit-viewport">
                                <span class="fit-text product-name-text"
                                      th:text="${item.productName != null and item.productName != '' ? item.productName : '-'}">
                                    대리석 일자 선반 W (페블프러스트)
                                </span>
                            </div>
                        </td>
                    </tr>

                    <tr class="row-size">
                        <th scope="row" class="report-label">사이즈</th>
                        <td colspan="3"
                            class="fit-cell"
                            data-max-font="14.7"
                            data-min-font="8.0">
                            <div class="fit-viewport">
                                <span class="fit-text"
                                      th:text="${item.size != null and item.size != '' ? item.size : '-'}">
                                    700*100
                                </span>
                            </div>
                        </td>
                    </tr>

                    <tr class="row-memo">
                        <th scope="row" class="report-label">비고</th>
                        <td colspan="3"
                            class="fit-cell align-top memo-value"
                            data-max-font="12.5"
                            data-min-font="6.5">
                            <div class="fit-viewport memo-viewport">
                                <span class="fit-text"
                                      th:text="${item.adminMemo != null and item.adminMemo != '' ? item.adminMemo : '-'}">
                                    관리자 메모
                                </span>
                            </div>
                        </td>
                    </tr>
                </tbody>
                </table>

                <!--
                    viewBox는 표의 100% 너비 × 116mm 높이를 1000 × 1160 좌표로 표현합니다.
                    외곽선은 실제 영역 안쪽으로 1.5좌표만큼 넣고, 모든 내부선은 butt cap으로
                    정확히 끝내므로 어느 모서리에서도 선 끝이 바깥으로 튀어나오지 않습니다.
                -->
                <svg class="report-grid-lines"
                     viewBox="0 0 1000 1160"
                     preserveAspectRatio="none"
                     aria-hidden="true"
                     focusable="false">
                    <rect x="1.5" y="1.5" width="997" height="1157"></rect>

                    <line x1="1.5" y1="220" x2="998.5" y2="220"></line>
                    <line x1="1.5" y1="440" x2="998.5" y2="440"></line>
                    <line x1="1.5" y1="660" x2="998.5" y2="660"></line>
                    <line x1="1.5" y1="880" x2="998.5" y2="880"></line>

                    <line x1="200" y1="1.5" x2="200" y2="1158.5"></line>
                    <line x1="500" y1="220" x2="500" y2="440"></line>
                    <line x1="700" y1="220" x2="700" y2="440"></line>
                </svg>
            </div>
        </article>

        <article th:if="${pageItems.size() < 4}"
                 th:each="x : ${#numbers.sequence(1, 4 - pageItems.size())}"
                 class="label empty"
                 aria-hidden="true">
            <span>.</span>
        </article>
    </div>

    <script>
        (function () {
            'use strict';

            var DEFAULT_MAX_FONT_PT = 14.7;
            var ABSOLUTE_MIN_FONT_PT = 5.0;
            var FONT_PRECISION_PT = 0.05;
            var FIT_TOLERANCE_PX = 0.75;

            function numberOrDefault(value, fallback) {
                var parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : fallback;
            }

            function availableContentSize(cell) {
                var viewport = cell.querySelector('.fit-viewport');

                /*
                 * 고정 뷰포트가 있으면 그 크기만을 기준으로 적합 여부를 판단합니다.
                 * 긴 비고 때문에 실제 table 행이 커진 값을 기준으로 삼지 않습니다.
                 */
                if (viewport) {
                    return {
                        width: Math.max(0, viewport.clientWidth),
                        height: Math.max(0, viewport.clientHeight)
                    };
                }

                var style = window.getComputedStyle(cell);
                var width = cell.clientWidth
                    - numberOrDefault(parseFloat(style.paddingLeft), 0)
                    - numberOrDefault(parseFloat(style.paddingRight), 0);
                var height = cell.clientHeight
                    - numberOrDefault(parseFloat(style.paddingTop), 0)
                    - numberOrDefault(parseFloat(style.paddingBottom), 0);

                return {
                    width: Math.max(0, width),
                    height: Math.max(0, height)
                };
            }

            function setFontSize(content, fontSize) {
                content.style.fontSize = fontSize.toFixed(2) + 'pt';
            }

            function setNaturalWrapping(content) {
                content.style.wordBreak = 'keep-all';
                content.style.overflowWrap = 'normal';
            }

            function setEmergencyWrapping(content) {
                content.style.wordBreak = 'keep-all';
                content.style.overflowWrap = 'anywhere';
            }

            function isContentFitted(content, size) {
                return content.scrollWidth <= size.width + FIT_TOLERANCE_PX
                    && content.scrollHeight <= size.height + FIT_TOLERANCE_PX;
            }

            /*
             * 제품명 마지막에 붙는 대괄호 정보는 내용 비교 없이 제거합니다.
             *
             * 예시
             * "대리석 일자 선반 W [욕실용품]" -> "대리석 일자 선반 W"
             * "대리석 일자 선반 W[대리석 일자 선반 W]" -> "대리석 일자 선반 W"
             * "제품명 [품목] [추가 품목]" -> "제품명"
             */
            function removeTrailingBracketText(value) {
                var text = String(value || '').trim();

                /*
                 * Thymeleaf가 JavaScript 정규식의 연속 대괄호를
                 * 인라인 표현식으로 오해할 수 있으므로 정규식을 사용하지 않습니다.
                 */
                while (text.endsWith(']')) {
                    var openingBracketIndex = text.lastIndexOf('[');

                    if (openingBracketIndex < 0) {
                        break;
                    }

                    text = text.substring(0, openingBracketIndex).trim();
                }

                return text || '-';
            }

            function sanitizeAllProductNames() {
                document.querySelectorAll('.product-name-text').forEach(function (element) {
                    element.textContent = removeTrailingBracketText(element.textContent);
                });
            }

            function findLargestFittedFont(content, size, minFont, maxFont) {
                var low = minFont;
                var high = maxFont;
                var best = null;
                var i;

                for (i = 0; i < 18; i += 1) {
                    var mid = (low + high) / 2;
                    setFontSize(content, mid);

                    if (isContentFitted(content, size)) {
                        best = mid;
                        low = mid;
                    } else {
                        high = mid;
                    }
                }

                return best;
            }

            /*
             * 처리 순서
             * 1. 확대된 기준 글꼴로 자연스러운 줄바꿈
             * 2. 한 단어가 너무 길 때만 셀 내부 강제 줄바꿈
             * 3. 그래도 넘치는 경우에만 해당 셀 글꼴 축소
             *
             * 표 전체 크기와 각 행 높이는 항상 고정합니다.
             * 내용 줄 수가 늘어나도 칸은 커지지 않고 글꼴 크기만 축소됩니다.
             */
            function fitTextCell(cell) {
                var content = cell.querySelector('.fit-text');

                if (!content) {
                    return;
                }

                var maxFont = numberOrDefault(
                    cell.getAttribute('data-max-font'),
                    DEFAULT_MAX_FONT_PT
                );
                var preferredMinFont = numberOrDefault(
                    cell.getAttribute('data-min-font'),
                    ABSOLUTE_MIN_FONT_PT
                );
                var size = availableContentSize(cell);

                if (size.width <= 0 || size.height <= 0) {
                    return;
                }

                content.style.width = '100%';
                content.style.maxWidth = '100%';
                content.style.lineHeight = '1.18';
                cell.style.overflow = 'hidden';

                setFontSize(content, maxFont);
                setNaturalWrapping(content);

                if (isContentFitted(content, size)) {
                    return;
                }

                setEmergencyWrapping(content);

                if (isContentFitted(content, size)) {
                    return;
                }

                var preferredMin = Math.max(
                    Math.min(preferredMinFont, maxFont),
                    ABSOLUTE_MIN_FONT_PT
                );
                var fittedFont = findLargestFittedFont(
                    content,
                    size,
                    preferredMin,
                    maxFont
                );

                if (fittedFont !== null) {
                    setFontSize(content, fittedFont);
                    return;
                }

                var safetyFont = preferredMin;
                setFontSize(content, safetyFont);

                while (safetyFont > ABSOLUTE_MIN_FONT_PT) {
                    safetyFont = Math.max(
                        ABSOLUTE_MIN_FONT_PT,
                        safetyFont - FONT_PRECISION_PT
                    );
                    setFontSize(content, safetyFont);

                    if (isContentFitted(content, size)) {
                        return;
                    }
                }

                /* 비정상적으로 긴 값도 고정 스티커 영역 밖으로 나오지 않도록 제한합니다. */
                setFontSize(content, ABSOLUTE_MIN_FONT_PT);
            }

            function fitAllText() {
                sanitizeAllProductNames();
                document.querySelectorAll('.fit-cell').forEach(fitTextCell);
            }

            function waitForFonts() {
                if (document.fonts && document.fonts.ready) {
                    return document.fonts.ready.catch(function () {
                        return undefined;
                    });
                }

                return Promise.resolve();
            }

            window.addEventListener('beforeprint', fitAllText);

            window.addEventListener('load', function () {
                waitForFonts().then(function () {
                    fitAllText();

                    window.requestAnimationFrame(function () {
                        window.setTimeout(function () {
                            fitAllText();
                            window.print();
                        }, 160);
                    });
                });
            });
        })();
    </script>
</body>
</html>
