<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/front/common :: autoHead}"></head>

<body class="theme-light sign-in-page" data-highlight="highlight-red" data-gradient="body-default">
	<link rel="stylesheet" href="/front/auth-modern.css">
	<th:block th:replace="~{fragments/front/common :: autoLoader}"></th:block>

	<div id="page">
		<div class="sign-in-shell">
			<header class="sign-in-topbar">
				<div class="container-xl sign-in-topbar-inner">
					<a class="sign-in-brand" th:href="@{/loginForm}">
						<span class="sign-in-brand-mark"><i class="fa-solid fa-h"></i></span>
						<span>HIDDEN BATH</span>
					</a>
					<a class="sign-in-topbar-link" th:href="@{/loginForm}">로그인으로 돌아가기</a>
				</div>
			</header>

			<main class="sign-in-main">
				<div class="container-xl">
					<section class="sign-in-recovery-page-card">
						<div class="sign-in-recovery-page-icon"><i class="fa-solid fa-key"></i></div>
						<div class="sign-in-heading">
							<div class="sign-in-eyebrow">ACCOUNT RECOVERY</div>
							<h1 class="sign-in-title">비밀번호 찾기</h1>
							<p class="sign-in-subtitle">아이디와 가입 시 등록한 휴대폰 번호가 일치하면 임시 비밀번호를 문자로 발송합니다.</p>
						</div>

						<form id="sign-in-find-password-form" th:action="@{/findPasswordProcess}" method="post" autocomplete="off">
							<div class="row g-3">
								<div class="col-lg-6">
									<label class="sign-in-label" for="sign-in-find-password-username"><span>아이디</span><span class="sign-in-required">필수</span></label>
									<input type="text" id="sign-in-find-password-username" name="username"
										class="form-control sign-in-control" placeholder="가입한 아이디" autocomplete="username" required>
								</div>
								<div class="col-lg-6">
									<label class="sign-in-label" for="sign-in-find-password-phone"><span>휴대폰 번호</span><span class="sign-in-required">필수</span></label>
									<input type="tel" id="sign-in-find-password-phone" name="phone"
										class="form-control sign-in-control sign-in-phone-input" inputmode="numeric"
										placeholder="010-0000-0000" maxlength="13" required>
								</div>
							</div>
							<button type="submit" class="sign-in-submit mt-4">임시 비밀번호 문자 받기</button>
						</form>

						<div class="sign-in-bottom-links">
							<a th:href="@{/loginForm}">로그인</a>
							<span>·</span>
							<a th:href="@{/findUsername}">아이디 찾기</a>
							<span>·</span>
							<a th:href="@{/signUp}">회원가입</a>
						</div>
					</section>
				</div>
			</main>
		</div>
	</div>

	<th:block th:replace="~{fragments/front/common :: beforeLoginScript}"></th:block>
	<script src="/front/find.js"></script>
</body>
</html>
