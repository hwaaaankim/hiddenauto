feature:
  amount-item-sync:
    enabled: true

spring:
  profiles:
    active: prod

  application:
    name: HiddenBATHAuto

  jpa:
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

  # 활성 프로필 파일에도 같은 값이 있으며, 프로필 누락 시에도 대용량 multipart를 허용합니다.
  servlet:
    multipart:
      maxFileSize: 5000MB
      maxRequestSize: -1

as:
  sms:
    reminder:
      template: |
        [히든바스] 내일({date}) 신청하신 AS에 대한 기사님이 방문하실 예정입니다.
        기사님 성함 : {engineerName}
        기사님 연락처 : {engineerPhone}

server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 43200m
      cookie:
        max-age: 2592000
        name: SID
        http-only: true
        secure: false

kakao:
  base-url: https://dapi.kakao.com
  rest:
    api-key: "0daa583a542a7c7639b42072873d05b9"
  throttle-ms: 120

juso:
  confm-key: "devU01TX0FVVEgyMDI2MDExMDEzMDkyNjExNzQyMDk="
  base-url: https://business.juso.go.kr
  first-sort: location
  throttle-ms: 0
  count-per-page: 10
  timeout-seconds: 5

app:
  # 엑셀 발주 화면/서버 공통 이미지 업무 제한입니다.
  # HTTP multipart 자체는 위 spring.servlet.multipart 설정을 사용합니다.
  order-excel-upload:
    image:
      max-file-size-bytes: 524288000
      max-total-size-bytes: 1073741824

  order-notification:
    enabled: true
    notify-actor: false
    kakao:
      enabled: true
      emergency-enabled: true
      normal-enabled: true
      template-code: "D8jAppuvn1"
  as-notification:
    enabled: true
    notify-actor: false
    kakao:
      enabled: true
      template-code: "D8jAppuvn1"

  notification:
    solapi:
      # 현재 공통 설정은 발주 알림 SOLAPI 실발송 활성화
      enabled: true
      base-url: "https://api.solapi.com"
      api-key: "NCSGC2QXIZYWKYN5"
      api-secret: "AEKLD58N5T3RIEHWG03NN9XAJSIUB1JN"
      pf-id: "KA01PF260511070059999uAZVskW1K4k"
      default-from: "01038993660"
      webhook-secret: "hiddenauto-dev-solapi-webhook-secret"
      strict: true
      allow-duplicates: false
      request-timeout-seconds: 10

security:
  remember-me:
    key: hiddenremember
    secure-cookie: false

logging:
  config: classpath:logback-spring.xml
  level:
    com.dev.HiddenBATHAuto.notification: DEBUG

hiddenbath:
  product-drawing:
    # 프로젝트에 포함된 로컬 diagrams.net 편집기
    editor-url: "/administration/assets/libs/diagrams/index.html"

    # 이미지 → 편집 가능한 도면 초안 생성
    vision-model: "gpt-6.1-sol"
    vision-reasoning-effort: medium
    max-draft-completion-tokens: 32768

    # GPT 요청·응답, 도형 데이터, 생성 XML 상세 로그
    diagnostic-logging-enabled: true
    diagnostic-log-max-chars: 131072

  rag:
    datasource:
      driver-class-name: org.postgresql.Driver

      # 로컬 Windows는 서버 RAG dev DB를 SSH 터널로 봅니다.
      # 실행 명령:
      # ssh -N -L 15433:127.0.0.1:5433 ubuntu@1.234.53.160
      url: jdbc:postgresql://127.0.0.1:15433/ax_rag_dev
      username: ax_rag_dev_user
      password: "ax_pass_1234"
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        pool-name: rag-postgres-pool-local-dev

    openai:
      # 도면 AI와 RAG가 이 API 키를 함께 사용합니다.
      # 실행 프로세스의 OPENAI_API_KEY 환경변수에서 읽습니다.
      # 미등록 시 빈 값으로 처리되며, OpenAI API를 호출하는 기능은 사용할 수 없습니다.
      api-key: "${OPENAI_API_KEY:}"

      base-url: "https://api.openai.com"

      # 기존 RAG 채팅 설정
      # 도면 AI 모델은 위 product-drawing.vision-model로 별도 지정
      chat-model: "gpt-5.6"
      embedding-model: "text-embedding-3-large"
      reasoning-effort: medium
      read-timeout-seconds: 180
      retry-count: 1

      # V4 GPT 중심 Agent
      agent-capability-version: "V4-20260714"
      agent-max-tool-turns: 30
      agent-no-progress-limit: 3
      agent-recovery-attempts: 2
      agent-text-recovery-enabled: true
      agent-max-output-tokens: 16000
      agent-max-context-chars: 220000
      agent-recent-message-limit: 12

      # DB Tool/ChangeSet 제한
      agent-default-read-rows: 200
      agent-hard-max-read-rows: 1000
      agent-query-timeout-seconds: 60
      agent-max-tool-output-chars: 60000
      agent-max-file-preview-chars: 40000
      agent-max-sql-chars: 50000
      agent-max-params-chars: 100000
      agent-max-change-items: 100
      agent-max-affected-rows-per-statement: 1

      # 8192 embedding context 오류 방지
      semantic-embedding-input-chars: 4500
      semantic-embedding-estimated-token-limit: 7000
      semantic-embedding-dimensions: 1536
      semantic-worker-enabled: true
      semantic-worker-delay-ms: 5000
      semantic-worker-batch-size: 10
      semantic-worker-max-attempts: 6
      semantic-worker-lock-timeout-seconds: 300
      semantic-content-max-chars: 60000
      semantic-query-embedding-enabled: true
      semantic-default-search-limit: 15
      semantic-hard-search-limit: 100

      # 장문 학습 계층형 분할
      adaptive-chunk-threshold-chars: 1200
      adaptive-chunk-chars: 2800
      adaptive-chunk-overlap-chars: 220
      adaptive-group-size: 4
      adaptive-max-leaf-chunks: 480

    upload:
      base-dir: "${user.home}/hiddenbath-rag-upload"
      asset-sub-dir: rag-assets
      public-url-prefix: /administration/upload/rag-assets
      max-file-size-bytes: 52428800

  order:
    mirror-cutting:
      enabled: true

      # 제품명/시리즈/카테고리/옵션 전체에서 찾을 키워드입니다.
      # 처음에는 과탐지를 막기 위해 아주 명확한 키워드만 넣는 것을 권장합니다.
      any-text-keywords:
        - 거울재단
        - 거울 재단
        - 미러재단
        - 미러 재단

      # 제품명만 검사할 키워드입니다. 넓게 잡으면 과탐지될 수 있어 기본은 비워둡니다.
      product-name-keywords: []

      # 규격 카테고리, 제품시리즈, 생산팀 분류명에서 검사할 키워드입니다.
      series-keywords:
        - 거울
        - 미러

      # 옵션명/옵션값에서 검사할 키워드입니다.
      option-keywords:
        - 거울재단
        - 거울 재단
        - 미러재단
        - 미러 재단

      # 실제 제품 대표명 목록입니다.
      # 여기에 실제 제품명만 계속 추가하면 됩니다.
      canonical-product-names:
        - 거울장
        - 미러장

      # 같은 제품 판정 시 제거할 변형 토큰입니다.
      ignore-tokens:
        - 1도어
        - 2도어
        - 3도어
        - 4도어
        - 일도어
        - 이도어
        - 삼도어
        - 사도어
        - HG
        - HB
        - HW
        - HC
        - 히든그레이
        - 히든블랙
        - 히든화이트
        - 히든크림
